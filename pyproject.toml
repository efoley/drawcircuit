[project]
name = "drawcircuit"
version = "0.1.0"
description = "Turn a hand-drawn race track sketch into B-spline track edges"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-image>=0.21",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
]

[project.scripts]
drawcircuit = "drawcircuit.cli:main"
drawcircuit-3d = "drawcircuit.render3d:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
